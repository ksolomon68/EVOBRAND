name: Build & Commit Dist

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      # Only run when source files actually change (not when dist/ itself changes)
      - 'apps/web/src/**'
      - 'apps/web/public/**'
      - 'apps/web/index.html'
      - 'apps/web/vite.config.js'
      - 'apps/web/tailwind.config.js'
      - 'apps/web/postcss.config.js'
      - 'apps/web/package.json'
      - 'apps/web/tools/**'
      # API has no build step, but it still needs cPanel to pull + restart it
      - 'apps/api/**'
      # .cpanel.yml IS the deployment script cPanel runs — a change here needs
      # to reach the server the same way, or it never actually takes effect
      - '.cpanel.yml'

jobs:
  build:
    name: Build frontend & update dist
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Full history needed so we can push back
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.1'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/web

      - name: Clean old dist assets
        run: rm -rf dist/apps/web/assets/ dist/apps/web/index.html

      - name: Build frontend
        run: npm run build
        working-directory: apps/web
        env:
          VITE_YOUTUBE_API_KEY: AIzaSyB7Akidw7RMlWPX5erpbxh_OJhTo4ch5Vg
          VITE_SITE_URL: https://evobrand.net

      - name: Sync deploy/ (the folder actually served at evobrandconcepts.com)
        # deploy/ mirrors dist/apps/web's app shell — index.html, the hashed
        # JS/CSS bundle, and the route-list files (llms.txt, robots.txt,
        # sitemap.xml) — so a merge to main is always live, not just built.
        # It intentionally does NOT mirror dist/ wholesale: deploy/ carries
        # extra static/legacy files (favicon, fonts, PHP migration tools,
        # project images) that aren't part of the Vite build and must not
        # be deleted or overwritten by it.
        run: |
          rm -rf deploy/assets
          cp -r dist/apps/web/assets deploy/assets
          cp dist/apps/web/index.html deploy/index.html
          [ -f dist/apps/web/llms.txt ]    && cp dist/apps/web/llms.txt    deploy/llms.txt    || true
          [ -f dist/apps/web/robots.txt ]  && cp dist/apps/web/robots.txt  deploy/robots.txt  || true
          [ -f dist/apps/web/sitemap.xml ] && cp dist/apps/web/sitemap.xml deploy/sitemap.xml || true

      - name: Sync project images into deploy/projects/
        # Keeps deploy/projects/ in sync with apps/web/public/projects/ so
        # any new or updated project images (screenshots, demo thumbnails)
        # are automatically available on the live site after a push.
        # Uses rsync-style cp behaviour: new files are added, existing files
        # are overwritten, but files deleted from public/ are NOT pruned from
        # deploy/ (keeps legacy images that may still be referenced elsewhere).
        run: |
          mkdir -p deploy/projects
          cp -r apps/web/public/projects/. deploy/projects/

      - name: Commit & push updated dist and deploy
        id: commit_dist
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/ deploy/
          # Only commit if something actually changed
          if git diff --staged --quiet; then
            echo "No dist/deploy changes to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "build: auto-rebuild dist and sync deploy [skip ci]"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Tell cPanel to pull the update (live site serves straight from this repo's deploy/ checkout)
        # Always runs — not gated on the dist/deploy commit above, because an
        # apps/api-only change never touches dist/deploy but still needs to
        # be pulled onto the server. Requires a CPANEL_API_TOKEN repo secret
        # (cPanel → Security → Manage API Tokens). Host/username/repo path
        # aren't secret, so they're inline.
        # continue-on-error: a cPanel hiccup (expired token, dirty repo, etc.)
        # must never mark the overall build as failed — but it must also not
        # go unnoticed, so success/failure is captured and reported below.
        id: cpanel_update
        continue-on-error: true
        run: |
          echo "=== cPanel Git/update ==="
          resp=$(curl -sS \
            -H "Authorization: cpanel evobrandconcepts:${{ secrets.CPANEL_API_TOKEN }}" \
            "https://evobrandconcepts.com:2083/execute/Git/update?repository_root=/home/evobrandconcepts/EVOBRAND")
          echo "$resp" | python3 -m json.tool || echo "$resp"
          ok=$(echo "$resp" | python3 -c "import json,sys; d=json.load(sys.stdin); print('true' if not d.get('errors') else 'false')" 2>/dev/null || echo false)
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          {
            echo "resp<<CPANEL_EOF"
            echo "$resp"
            echo "CPANEL_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Tell cPanel to deploy (runs .cpanel.yml — rsyncs apps/api and restarts the Node API)
        # Git/update only pulls the repo; it does not run .cpanel.yml. The API
        # process (Passenger/lsnode) keeps running the old code until
        # .cpanel.yml's rsync + restart.txt touch + lsnode kill actually run,
        # which only happens via this separate Git/deploy call.
        id: cpanel_deploy
        continue-on-error: true
        run: |
          echo "=== cPanel Git/deploy ==="
          resp=$(curl -sS \
            -H "Authorization: cpanel evobrandconcepts:${{ secrets.CPANEL_API_TOKEN }}" \
            "https://evobrandconcepts.com:2083/execute/Git/deploy?repository_root=/home/evobrandconcepts/EVOBRAND")
          echo "$resp" | python3 -m json.tool || echo "$resp"
          ok=$(echo "$resp" | python3 -c "import json,sys; d=json.load(sys.stdin); print('true' if not d.get('errors') else 'false')" 2>/dev/null || echo false)
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          {
            echo "resp<<CPANEL_EOF"
            echo "$resp"
            echo "CPANEL_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Report cPanel deploy status (open/comment or close a tracking issue)
        # Neither cPanel step above is allowed to fail the build, so this is the
        # only place a broken deploy actually surfaces. Keeps ONE issue open
        # (labeled cpanel-deploy-broken) instead of filing a new one per push —
        # comments on it while still broken, closes it once both calls succeed.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_OK: ${{ steps.cpanel_update.outputs.ok }}
          DEPLOY_OK: ${{ steps.cpanel_deploy.outputs.ok }}
          UPDATE_RESP: ${{ steps.cpanel_update.outputs.resp }}
          DEPLOY_RESP: ${{ steps.cpanel_deploy.outputs.resp }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          gh label create cpanel-deploy-broken --color "d73a4a" --description "cPanel Git/update or Git/deploy API call is failing" --force -R "${{ github.repository }}" 2>/dev/null || true
          existing=$(gh issue list -R "${{ github.repository }}" --label cpanel-deploy-broken --state open --json number --jq '.[0].number // empty')

          if [ "$UPDATE_OK" = "true" ] && [ "$DEPLOY_OK" = "true" ]; then
            echo "cPanel deploy calls succeeded."
            if [ -n "$existing" ]; then
              gh issue comment "$existing" -R "${{ github.repository }}" --body "✅ Recovered — both \`Git/update\` and \`Git/deploy\` succeeded on commit \`${SHA:0:7}\`. See $RUN_URL."
              gh issue close "$existing" -R "${{ github.repository }}"
            fi
          else
            echo "cPanel deploy call(s) failed."
            body=$(printf '%s\n' \
              "The automated cPanel deploy step in \`build-and-deploy.yml\` failed on commit \`${SHA:0:7}\`, meaning **this push was NOT deployed to evobrandconcepts.com**." \
              "" \
              "- \`Git/update\`: ${UPDATE_OK}" \
              "- \`Git/deploy\`: ${DEPLOY_OK}" \
              "" \
              "**Git/update response:**" \
              '```json' \
              "${UPDATE_RESP}" \
              '```' \
              "" \
              "**Git/deploy response:**" \
              '```json' \
              "${DEPLOY_RESP}" \
              '```' \
              "" \
              "Workflow run: ${RUN_URL}" \
              "" \
              "**To deploy this manually right now:** cPanel → Git Version Control → EVOBRAND repo → \"Update from Remote\", then \"Deploy HEAD Commit\".")
            if [ -n "$existing" ]; then
              gh issue comment "$existing" -R "${{ github.repository }}" --body "Still failing as of commit \`${SHA:0:7}\`. See $RUN_URL."
            else
              gh issue create -R "${{ github.repository }}" --title "cPanel auto-deploy is failing" --label cpanel-deploy-broken --body "$body"
            fi
          fi
