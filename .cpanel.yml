---
deployment:
  tasks:
    # Deploy frontend
    - export DEPLOYPATH=/home/evobrandconcepts/public_html
    - /bin/cp -R dist/apps/web/* $DEPLOYPATH || true

    # Deploy API source files (try both common cPanel Node.js app paths)
    - mkdir -p /home/evobrandconcepts/EVOBRAND/apps/api/src && /bin/cp -R apps/api/src/* /home/evobrandconcepts/EVOBRAND/apps/api/src/ || true
    - /bin/cp apps/api/package.json /home/evobrandconcepts/EVOBRAND/apps/api/ || true
    - mkdir -p /home/evobrandconcepts/nodeapp/src && /bin/cp -R apps/api/src/* /home/evobrandconcepts/nodeapp/src/ || true
    - /bin/cp apps/api/package.json /home/evobrandconcepts/nodeapp/ || true

    # Restart Node.js Passenger app
    - mkdir -p /home/evobrandconcepts/EVOBRAND/apps/api/tmp && touch /home/evobrandconcepts/EVOBRAND/apps/api/tmp/restart.txt
    - mkdir -p /home/evobrandconcepts/nodeapp/tmp && touch /home/evobrandconcepts/nodeapp/tmp/restart.txt
